[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-email-analyzer"
version = "0.2.0"
description = "An offline, explainable phishing email and URL triage CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tldextract>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]

[project.scripts]
phishing-analyzer = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["email_checks", "email_parser", "main", "report", "signals", "url_checks"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
